async function orderPng(o){
  if(!o)return;
  try{await Promise.all(['400','600','700'].map(w=>document.fonts.load(w+' 18px "Hind Siliguri"')))}catch(e){}
  const li=await loadImg(LOGO);
  const W=800,M=40,FN='"Hind Siliguri",system-ui,sans-serif',cv=document.createElement('canvas'),x=cv.getContext('2d'),ops=[];let y=150;
  const wrap=(t,mw,f)=>{x.font=f;const r=[];let l='';for(const w of String(t).split(/\s+/)){const tr=l?l+' '+w:w;if(x.measureText(tr).width>mw&&l){r.push(l);l=w}else l=tr}if(l)r.push(l);return r};
  const add=(t,sz,w,c,al,mw)=>{const f=`${w} ${sz}px ${FN}`;wrap(t,mw||W-2*M,f).forEach(l=>{ops.push({t:l,f,c,al:al||'left',y});y+=Math.round(sz*1.55)})};
  const row=(l,r,sz,w,c)=>{sz=sz||18;const f=`${w||600} ${sz}px ${FN}`;ops.push({t:l,f,c:'#475569',al:'left',y},{t:String(r),f,c:c||'#0f172a',al:'right',y});y+=Math.round(sz*1.65)};
  const hr=()=>{ops.push({hr:1,y:y+4});y+=18};
  add('অর্ডার রসিদ',22,700,'#0284c7');
  add(o.order_no,30,700,'#0f172a');
  add(new Date(o.created_at).toLocaleString('bn-BD'),16,400,'#64748b');
  row('অবস্থা',STB[o.order_status]||o.order_status);
  hr();
  add('গ্রাহকের তথ্য',18,700,'#0284c7');
  add(o.customer_name+' · '+o.customer_phone,19,600,'#0f172a');
  add(o.address+', '+o.district+', '+o.division,17,400,'#334155');
  hr();
  add('পণ্য',18,700,'#0284c7');
  o.items.forEach(i=>{const y0=y;add(i.title,19,600,'#0f172a','left',500);ops.push({t:tk(i.price*i.qty),f:`700 19px ${FN}`,c:'#0f172a',al:'right',y:y0});const v=vr(i);add((v?v+' · ':'')+tk(i.price)+' × '+i.qty,15,400,'#64748b')});
  hr();
  row('সাবটোটাল',tk(o.subtotal));row('ডেলিভারি ('+o.district+')',tk(o.delivery_fee));row('সর্বমোট',tk(o.total),24,700,'#0284c7');
  hr();
  row('পেমেন্ট',o.payment_method);if(o.transaction_id)row('TrxID',o.transaction_id);row('পেমেন্টের অবস্থা',o.payment_status,16);
  const H=y+130;cv.width=W;cv.height=H;
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#0284c7';x.fillRect(0,0,W,120);
  x.textBaseline='top';x.textAlign='center';x.fillStyle='#fff';x.font=`700 46px ${FN}`;x.fillText(SHOP.name,W/2,14);x.font=`400 16px ${FN}`;x.fillText(SHOP.addr+' · WhatsApp 01794596281',W/2,82);
  if(li){const h=76,w=Math.min(150,li.width/li.height*h);x.fillStyle='#fff';x.beginPath();if(x.roundRect)x.roundRect(M-6,22,w+12,h+12,14);else x.rect(M-6,22,w+12,h+12);x.fill();x.drawImage(li,M,28,w,h)}
  x.save();x.translate(W/2,H/2);x.rotate(-.5);x.globalAlpha=.06;x.fillStyle='#0284c7';x.font=`700 120px ${FN}`;x.fillText(SHOP.name,0,-60);x.restore();
  ops.forEach(p=>{if(p.hr){x.fillStyle='#e2e8f0';x.fillRect(M,p.y,W-2*M,2);return}x.font=p.f;x.fillStyle=p.c;x.textAlign=p.al;x.fillText(p.t,p.al==='right'?W-M:M,p.y)});
  x.fillStyle='#0284c7';x.fillRect(0,H-110,W,110);x.textAlign='center';x.fillStyle='#fff';x.font=`700 22px ${FN}`;x.fillText('ধন্যবাদ! আপনার অর্ডারের জন্য',W/2,H-98);x.font=`600 18px ${FN}`;x.fillText(SHOP.name+' · WhatsApp 01794596281',W/2,H-62);x.font=`400 15px ${FN}`;x.fillText(SHOP.mail,W/2,H-34);
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=SHOP.name.replace(/\s+/g,'-')+'-'+o.order_no+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)},'image/png');
}

async function saveProduct(){

  <label><input id="y_cod" type="checkbox" ${p.cod_enabled!==false?'checked':''}> ক্যাশ অন ডেলিভারি চালু</label><label><input id="y_adv" type="checkbox" ${p.advance_required?'checked':''}> ঢাকার বাইরে অগ্রিম ডেলিভারি চার্জ নোট দেখান</label><label>নোট</label><input id="y_note" value="${esc(p.advance_note||'ঢাকার বাইরে ডেলিভারি চার্জ অগ্রিম প্রযোজ্য')}"><br><button onclick="savePay()">সংরক্ষণ করুন</button><p class="sm">নম্বর ফাঁকা রাখলে ওই পেমেন্ট অপশন চেকআউটে দেখাবে না।</p></div>`;
}
async function savePay(){const v=id=>$('#'+id).value.trim(),r=await sb.from('payment_settings').upsert({id:1,bkash_number:v('y_bn'),bkash_type:v('y_bt'),nagad_number:v('y_nn'),nagad_type:v('y_nt'),cod_enabled:$('#y_cod').checked,advance_required:$('#y_adv').checked,advance_note:v('y_note')});if(!dbErr(r)){await loadAll();toast('সংরক্ষিত')}}
const linkOpts=sel=>`<option value="">কোনো লিংক নয়</option><optgroup label="প্রোডাক্ট">${P.map(p=>`<option value="p:${esc(p.id)}" ${sel==='p:'+p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup><optgroup label="ক্যাটাগরি">${[...new Set(P.map(p=>p.category))].map(c=>`<option value="${esc(c)}" ${sel===c?'selected':''}>${esc(c)}</option>`).join('')}</optgroup>`;
async function setBLink(id,v){const r=await sb.from('banners').update({target_category:v||null}).eq('id',id);if(!dbErr(r)){await loadAll();toast('লিংক সংরক্ষিত')}}
function aLogo(){
  $('#tb').innerHTML=`<div class="box"><h2>দোকানের লোগো</h2><p class="sm">লোগো হেডার, ফুটার, আমাদের সম্পর্কে, লগইন পেজ, অর্ডার রসিদ (PNG ও প্রিন্ট) এবং ব্রাউজার আইকনে দেখাবে।</p><div style="margin:10px 0">${LOGO?`<img src="${esc(LOGO)}" style="height:80px;width:auto;max-width:100%;border-radius:12px;border:1px solid var(--bd);background:#fff;padding:6px" alt="">`:'<p class="sm">এখনো কোনো লোগো দেওয়া হয়নি।</p>'}</div><label>লোগো আপলোড (PNG / JPG / WebP)</label><input id="lg_f" type="file" accept="image/*"><label>অথবা লোগোর URL</label><input id="lg_u" placeholder="https://..."><br><br><div class="row"><button id="lg_s" onclick="saveLogo()">লোগো সংরক্ষণ করুন</button>${LOGO?'<button class="d" onclick="delLogo()">লোগো সরান</button>':''}</div></div>`;
}
async function saveLogo(){
  const f=$('#lg_f').files[0],u=$('#lg_u').value.trim();if(!f&&!u)return toast('একটি লোগো ফাইল বা URL দিন');
  $('#lg_s').disabled=true;
  try{const url=f?await upload(f):u;
    const r=await sb.from('banners').insert({title:'Logo',subtitle:'',tag:LOGO_TAG,target_category:null,sort_order:-1,image_url:url,is_active:true}).select('id').single();if(r.error)throw r.error;
    const d=await sb.from('banners').delete().eq('tag',LOGO_TAG).neq('id',r.data.id);if(d.error)throw d.error;
    await loadAll();hdr();toast('লোগো সংরক্ষিত হয়েছে');aLogo()}
  catch(e){toast(e.message);const b=$('#lg_s');if(b)b.disabled=false}
}
async function delLogo(){if(!confirm('লোগো সরাবেন?'))return;const r=await sb.from('banners').delete().eq('tag',LOGO_TAG);if(dbErr(r))return;await loadAll();hdr();aLogo()}
async function aBanners(){
  if(!loaded)await loadAll();
  const r=await sb.from('banners').select('*').order('sort_order');if(dbErr(r))return;AB=r.data.filter(b=>b.tag!==LOGO_TAG);
  $('#tb').innerHTML=`<div class="box"><h2>নতুন ব্যানার</h2><div class="row"><input id="b_t" placeholder="টাইটেল"><input id="b_s" placeholder="সাবটাইটেল"></div><div class="row"><input id="b_g" placeholder="ট্যাগ (যেমন MEGA DEAL)"><div><label style="margin-top:0">লিংক (প্রোডাক্ট বা ক্যাটাগরি)</label><select id="b_c">${linkOpts('')}</select></div><input id="b_o" type="number" placeholder="ক্রম"></div><label>ছবি আপলোড</label><input id="b_f" type="file" accept="image/*"><label>অথবা ছবির URL</label><input id="b_u"><br><br><button id="bs" onclick="saveBanner()">যোগ করুন</button></div>
  ${AB.length?AB.map(b=>`<div class="box row"><img src="${esc(b.image_url)}" style="width:110px;height:60px;object-fit:cover;border-radius:8px" alt=""><div><b>${esc(b.title)}</b><div class="sm">${esc(b.subtitle)}</div></div><select style="min-width:170px" aria-label="ব্যানার লিংক" onchange="setBLink('${b.id}',this.value)">${linkOpts(b.target_category||'')}</select><button class="g" onclick="togB('${b.id}',${!b.is_active})">${b.is_active?'বন্ধ করুন':'চালু করুন'}</button><button class="d" onclick="delRow('banners','${b.id}',aBanners,1)">মুছুন</button></div>`).join(''):empty('কোনো ব্যানার নেই')}`;
}
async function saveBanner(){
  const v=id=>$('#'+id).value.trim();$('#bs').disabled=true;
  try{const u=(await urls(v('b_u'),[...$('#b_f').files]))[0];if(!v('b_t')||!u)throw new Error('টাইটেল ও ছবি আবশ্যক');
    const r=await sb.from('banners').insert({title:v('b_t'),subtitle:v('b_s'),tag:v('b_g'),target_category:v('b_c')||null,sort_order:parseInt(v('b_o'))||0,image_url:u});if(r.error)throw r.error;await loadAll();aBanners()}
  catch(e){toast(e.message);$('#bs').disabled=false}
}
async function togB(id,a){const r=await sb.from('banners').update({is_active:a}).eq('id',id);if(!dbErr(r)){await loadAll();aBanners()}}

/* ---------- Optional customer account ---------- */
async function accountView(){
  if(me){
    const r=await sb.from('orders').select('*').eq('user_id',me.id).order('created_at',{ascending:false}),L=r.data||[];
    return app.innerHTML=`<div class="row"><h1 style="flex:1">আমার অ্যাকাউন্ট</h1><button class="g" onclick="custOut()">লগ আউট</button></div><p class="sm">${esc(me.email)}</p><h2>আমার অর্ডার</h2>`+(L.length?L.map(o=>`<div class="box"><div class="row"><b>${esc(o.order_no)}</b><span class="tag" style="flex:0 0 auto">${STB[o.order_status]||o.order_status}</span><b style="flex:0 0 auto">${tk(o.total)}</b></div><div class="sm">${new Date(o.created_at).toLocaleString('bn-BD')} · ${o.items.map(i=>esc(i.title)+' × '+i.qty).join(', ')}</div></div>`).join(''):empty('এখনো কোনো অর্ডার নেই'));
  }
  loginView();
}
function loginView(){
  const up=accMode==='up';
  app.innerHTML=`<div class="box" style="max-width:440px;margin:20px auto">${LOGO?`<div style="text-align:center;margin-bottom:8px">${logoImg(56)}</div>`:''}<h2>${up?'নতুন অ্যাকাউন্ট':'অ্যাকাউন্টে লগইন'}</h2><p class="sm">ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন। লগইন ছাড়াও কেনাকাটা করা যায়।</p>${up?'<label>নাম</label><input id="c_name"><label>মোবাইল</label><input id="c_phone" inputmode="tel">':''}
  <label>ইমেইল</label><input id="a_em" type="email" autocomplete="username"><label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="a_pw" type="password" autocomplete="${up?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')doLogin()">
  ${(!cfg||/[?&]setup/.test(location.search))?`<details open style="margin-top:12px"><summary class="sm">ডাটাবেজ কানেকশন (শুধু এডমিন)</summary><label>Project URL</label><input id="a_url" placeholder="https://xxxx.supabase.co" value="${esc(cfg?.url||'')}"><label>Publishable Key</label><input id="a_key" value="${esc(cfg?.key||'')}"></details>`:''}
  <button style="width:100%;margin-top:14px" id="lb" onclick="doLogin()">${up?'অ্যাকাউন্ট খুলুন':'লগইন'}</button>
  <p class="sm" style="text-align:center"><a href="javascript:void 0" onclick="accMode='${up?'in':'up'}';loginView()" style="color:var(--pr)">${up?'অ্যাকাউন্ট আছে? লগইন করুন':'ইউজার? নতুন অ্যাকাউন্ট খুলুন'}</a></p></div>`;
}
async function doLogin(){
  const v=id=>$('#'+id)?.value.trim()||'',url=(v('a_url')||cfg?.url||'').replace(/\/+$/,''),key=v('a_key')||cfg?.key||'',email=v('a_em'),pw=$('#a_pw').value,up=accMode==='up';
  if(!url||!key)return toast('ডাটাবেজ কানেকশন থেকে Project URL ও Key দিন');
  if(!email||pw.length<6)return toast('ইমেইল ও কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন');
  $('#lb').disabled=true;
  try{
    const c=sb&&cfg&&cfg.url===url&&cfg.key===key?sb:supabase.createClient(url,key);
    const r=up?await c.auth.signUp({email,password:pw,options:{data:{name:v('c_name'),phone:v('c_phone')}}}):await c.auth.signInWithPassword({email,password:pw});
    if(r.error)throw r.error;
    if(!r.data.session){toast('ইমেইলে পাঠানো লিংকে কনফার্ম করে তারপর লগইন করুন');$('#lb').disabled=false;return}
    cfg={url,key};LS('gs_cfg',cfg);sb=c;me=r.data.user;
    const{data:a}=await c.from('admins').select('user_id').eq('user_id',me.id).maybeSingle();admin=!!a;
    await loadAll();hdr();toast('লগইন সফল');
    const h=admin?'#/admin':'#/account';if(location.hash===h)route();else location.hash=h;
  }catch(e){toast('ব্যর্থ: '+e.message);const b=$('#lb');if(b)b.disabled=false}
}
function aLive(){
  $('#tb').innerHTML=`<div class="box"><h2>ওয়েবসাইট লাইভ করুন</h2><p>১. নিচের বাটনে চাপুন — Project URL ও Key বসানো একটি ফাইল ডাউনলোড হবে।<br>২. ফাইলটা যেকোনো হোস্টিংয়ে (Netlify Drop, Vercel, GitHub Pages ইত্যাদি) আপলোড করুন।<br>৩. ওই লিংক সবাইকে দিন। লগইন ছাড়াই সবাই সাইট দেখবে ও অর্ডার করতে পারবে; চাইলে লগইন করতে পারবে, আর আপনি এডমিন হিসেবে একই লগইন থেকে ঢুকবেন।</p><button onclick="dlLive()">কানেকশন-সহ ফাইল ডাউনলোড</button><p class="sm">শুধু URL ও Publishable key বসে, কোনো পাসওয়ার্ড বা গোপন key নয়।</p></div>`;
}
function dlLive(){
  const d=document.documentElement.cloneNode(true);
  d.querySelector('#app').innerHTML='';const hd=d.querySelector('#hd');hd.innerHTML='';hd.removeAttribute('data-k');const t=d.querySelector('#toast');t.className='';t.textContent='';
  const T="const SUPABASE_URL=''"+",SUPABASE_KEY='';";let h='<!DOCTYPE html>\n'+d.outerHTML;
  if(!h.includes(T))return toast('এই ফাইলে আগেই কানেকশন বসানো আছে — এটাই হোস্ট করুন');
  h=h.replace(T,()=>'const SUPABASE_URL='+JSON.stringify(cfg.url)+',SUPABASE_KEY='+JSON.stringify(cfg.key)+';');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='gadget-spot-live.html';a.click();
}
async function custOut(){await sb.auth.signOut();me=null;admin=false;hdr();location.hash='#/'}


/* ---------- Boot ---------- */
const hadCache=!!cfg&&loadCache();
async function boot(){
  if(!cfg){sessDone=true;return}
  const before=snap();
  try{
    sb=supabase.createClient(cfg.url,cfg.key);
    const ss=sb.auth.getSession().then(async({data})=>{me=data.session?.user||null;if(me){const{data:a}=await sb.from('admins').select('user_id').eq('user_id',me.id).maybeSingle();admin=!!a}}).catch(()=>{}).then(()=>{sessDone=true;hdr();if(/^#\/(login|admin|account)/.test(location.hash))route()});
    const dd=loadAll().catch(e=>{loadErr=e.message}).then(()=>{
      const redo=!hadCache?!/^#\/(track|login|admin|account)/.test(location.hash):(snap()!==before&&/^(#\/?|#\/p\/.*|#\/cart)?$/.test(location.hash));
      if(redo)route();else hdr()});
    await Promise.all([ss,dd]);
  }catch(e){loadErr=e.message;sessDone=true;route()}
}
addEventListener('hashchange',route);
route();
if(document.readyState==='complete')boot();else addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
